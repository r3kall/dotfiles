general {
    lock_cmd = pidof hyprlock >/dev/null || { locker "lock"; hyprlock -q; }
    on_unlock_cmd = locker "unlock"
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = pkill -SIGUSR2 waybar
    inhibit_sleep = 3
}

listener {
    timeout = 600 # 10 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900 # 15 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1200 # 20min
    on-timeout = systemctl suspend
    on-resume = hyprctl dispatch dpms on
}
